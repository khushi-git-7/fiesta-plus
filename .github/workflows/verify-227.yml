name: verify-227
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    strategy:
      fail-fast: false
      matrix:
        phonenumbers: ["locked", "8.13.24"]
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: fiesta
          POSTGRES_PASSWORD: fiesta
          POSTGRES_DB: fiesta
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_CONFIGURATION: Development
      DJANGO_SECRET_KEY: ci-only-not-secret
      ROOT_DOMAIN: fiesta.test
      UV_PROJECT_ENVIRONMENT: /venv
      # dummy values: every SecretValue is read when the settings module is imported
      DJANGO_RECAPTCHA_SITE_KEY: ci
      DJANGO_RECAPTCHA_SECRET_KEY: ci
      DJANGO_AWS_S3_ACCESS_KEY_ID: ci
      DJANGO_AWS_S3_SECRET_ACCESS_KEY: ci
      DJANGO_AWS_STORAGE_BUCKET_NAME: ci
      DJANGO_AWS_S3_REGION_NAME: ci
      DJANGO_MAILER_PRIMARY_HOST: ci
      DJANGO_MAILER_PRIMARY_HOST_PASSWORD: ci
      DJANGO_MAILER_PRIMARY_HOST_USER: ci
      DJANGO_MAILER_PRIMARY_HOST_PORT: "25"
      # paths the Dockerfile sets for the web image
      DJANGO_STATIC_ROOT: /usr/src/static
      DJANGO_MEDIA_ROOT: /usr/src/media
      DJANGO_BUILD_DIR: /usr/src/build/
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: apt-get update && apt-get install -y default-libmysqlclient-dev pkg-config build-essential
      - name: Install
        run: |
          pip install uv
          uv sync --frozen --no-install-project
          uv pip install --python /venv/bin/python "setuptools<81"
      - name: Old phonenumberslite
        if: matrix.phonenumbers != 'locked'
        run: uv pip install --python /venv/bin/python "phonenumberslite==${{ matrix.phonenumbers }}"
      - name: Test
        working-directory: fiesta
        run: |
          mkdir -p /usr/src/wiki/db /usr/src/static /usr/src/media /usr/src/build
          /venv/bin/python -c "import phonenumbers; print('phonenumbers', phonenumbers.__version__)"
          /venv/bin/python manage.py test apps.accounts.forms.test_social_accounts_fields --verbosity 2
